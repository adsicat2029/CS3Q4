<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>About the Company</title>
    <style>
    body {
    background-color: #f4f7f6;
    color: #333;
    line-height: 1.6;
    padding: 40px 20px;
}

.author-section {
    max-width: 1100px;
    margin: 0 auto;
    text-align: center;
}

.section-title {
    font-size: 2.5rem;
    margin-bottom: 40px;
    color: #2c3e50;
    position: relative;
}

.section-title::after {
    content: '';
    display: block;
    width: 60px;
    height: 4px;
    background: #8951BD;
    margin: 10px auto;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
}

.author-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    padding: 30px;
    width: 320px;
    transition: transform 0.3s ease;
}

.author-card:hover {
    transform: translateY(-10px);
}

.image-wrapper {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
}

.image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid grey;
}

.author-card h3 {
    margin-bottom: 5px;
    font-size: 1.5rem;
}

.role {
    color: #8951BD;
    font-weight: bold;
    text-transform: uppercase;
    font-size: 0.85rem;
    margin-bottom: 15px;
    letter-spacing: 1px;
}

.bio {
    font-size: 12pt;
    color: #666;
    margin-bottom: 10px;
}
p {
  font-size: 10pt;
}



.back-home {
    margin-top: 50px;
    text-align: center;
}

.home-btn {
    padding: 12px 25px;
    background-color: white;
    color: #2c3e50;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 500;
    border: 2px solid transparent;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);

}


.home-btn:hover {
    color: #8951BD;
}
</style>
</head>
<body>
    <section class="author-section">
        <h1 class="section-title">About the Company</h1>
        <h2>‎ </h2>
        <div class="container">
            
            <div class="author-card">
                <div class="image-wrapper">
                    <img src="https://github.com/ldgurnote/cs4q4sa/blob/main/cbfb6e9c1a694787e49f631f54dcba24.jpeg?raw=true" alt="nico">
                </div>
                <h3>Nico Sicat</h3>
                <p class="role">Web Developer</p>
                <h4 class="bio">Main Contributions</h4>
              <p>Home Page</p>
               
            </div>

            <div class="author-card">
                <div class="image-wrapper">
                    <img src="https://github.com/ldgurnote/cs4q4sa/blob/main/aa83674978f5df891c331ed47bf7e21c.jpeg?raw=true" alt="elmo">
                </div>
                <h3>Elmo Romero</h3>
                <p class="role">Web Developer</p>
                <h4 class="bio">Main Contributions</h4>
              <p>Home Page</p>
                
            </div>

            <div class="author-card">
                <div class="image-wrapper">
                    <img src="https://github.com/ldgurnote/cs4q4sa/blob/main/IMG_8001.JPG?raw=true" alt="leane">
                </div>
                <h3>Leane Gurnote</h3>
                <p class="role">Web Developer</p>
                <h4 class="bio">Main Contributions</h4>
              <p>About Page</p>
            </div>

        </div>
    </section>
  <div class="back-home">
    <a href="index.html" class="home-btn">
        Return to Store
    </a>
</div>

</body>
</html>
